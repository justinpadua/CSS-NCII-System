# Activate with SPRING_PROFILES_ACTIVE=tidb. Local MySQL remains the default profile.
spring.datasource.url=jdbc:mysql://${TIDB_HOST}:${TIDB_PORT}/${TIDB_DATABASE}?sslMode=VERIFY_IDENTITY&tlsVersions=TLSv1.2,TLSv1.3
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}

# Use an explicit PKCS12 truststore. The default path is for local Windows testing;
# set TIDB_TRUSTSTORE_URL to a service-local path when deploying elsewhere.
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${TIDB_TRUSTSTORE_URL:file:/C:/CSS-NCII-Deployment/tidb-truststore.p12}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${TIDB_TRUSTSTORE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=com.cssncii.config.TiDBDialect
